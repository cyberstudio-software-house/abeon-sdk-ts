name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout abeon-shared
        uses: actions/checkout@v4
        with:
          path: abeon-shared

      - name: Checkout abeon-sdk-php (schemas source)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/abeon-sdk-php
          path: abeon-sdk-php
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abeon-shared/package-lock.json

      - name: Install
        working-directory: abeon-shared
        run: npm ci

      - name: Verify schemas in sync with abeon-sdk-php
        working-directory: abeon-shared
        run: npm run sync-schemas:check

      - name: Lint
        working-directory: abeon-shared
        run: npm run lint

      - name: Typecheck
        working-directory: abeon-shared
        run: npm run typecheck

      - name: Test
        working-directory: abeon-shared
        run: npm test

      - name: Build
        working-directory: abeon-shared
        run: npm run build
