name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout abeon-sdk-ts
        uses: actions/checkout@v4
        with:
          path: abeon-sdk-ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abeon-sdk-ts/package-lock.json

      - name: Install
        working-directory: abeon-sdk-ts
        run: npm ci

      - name: Lint
        working-directory: abeon-sdk-ts
        run: npm run lint

      - name: Typecheck
        working-directory: abeon-sdk-ts
        run: npm run typecheck

      - name: Test
        working-directory: abeon-sdk-ts
        run: npm test

      - name: Build
        working-directory: abeon-sdk-ts
        run: npm run build
